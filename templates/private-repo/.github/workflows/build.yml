name: Build Resume

on:
  push:
    branches:
      - main
      - 'resume/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # GitHub 编译 PDF 开关：由 resume-manager.config.json 控制（Resume Manager 设置页可配置）
      - name: Check PDF build switch
        id: switch
        run: |
          ENABLED="false"
          if [ -f resume-manager.config.json ]; then
            ENABLED=$(python3 -c "import json;print(str(json.load(open('resume-manager.config.json')).get('githubPdfBuild',False)).lower())" 2>/dev/null || echo "false")
          fi
          echo "enabled=$ENABLED" >> "$GITHUB_OUTPUT"
          echo "GitHub PDF 编译开关: $ENABLED"

      - name: GitHub PDF 编译已关闭（默认）
        if: steps.switch.outputs.enabled != 'true'
        run: |
          echo "::notice::GitHub PDF 编译已关闭，跳过构建。如需开启：在 Resume Manager 设置页打开「GitHub 编译 PDF」并同步到私有数据仓。"

      - name: Install PyYAML
        if: steps.switch.outputs.enabled == 'true'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq python3-yaml

      - name: Compose resumes from data
        if: steps.switch.outputs.enabled == 'true'
        run: python3 scripts/compose.py

      - name: Select resume files for this branch
        id: targets
        if: steps.switch.outputs.enabled == 'true'
        shell: bash
        run: |
          if [[ "$GITHUB_REF_NAME" == resume/* ]]; then
            TYPE="${GITHUB_REF_NAME#resume/}"
            FILE="resumes/${TYPE}.yml"
            if [ ! -f "$FILE" ]; then
              echo "::error::分支 $GITHUB_REF_NAME 没有对应的 $FILE"
              exit 1
            fi
            FILES="$FILE"
          else
            FILES=$(find resumes -maxdepth 1 -type f -name '*.yml' | sort)
          fi
          if [ -z "$FILES" ]; then
            echo "::error::没有可构建的简历文件"
            exit 1
          fi
          {
            echo 'files<<EOF'
            echo "$FILES"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Build resumes
        id: build
        if: steps.switch.outputs.enabled == 'true'
        uses: yamlresume/action@v0.2.3
        with:
          resumes: ${{ steps.targets.outputs.files }}
          verbose: true
          version: v0.14.1

      - name: Upload resume artifacts
        if: steps.switch.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: resume-artifacts
          path: |
            ${{ steps.build.outputs.pdf-files }}
            ${{ steps.build.outputs.html-files }}
          if-no-files-found: error
