# 最小示例配方：只保留一个通用简历方向。
# 先编辑 data/basics.yml、data/work.yml、data/skills.yml，再在管理端调整筛选规则。

defaults:
  locale: zh-hans
  layout:
    engine: html
    template: calm

variants:
  main:
    sectionOrder: [skills, work, education]
    blocks:
      basics: { include: true }
      work: { tags: [general] }
      skills: { tags: [general] }
      education: { include: all }
